server:
  port: 8081

spring:
  application:
    name: gatekeeper
  cloud:
    gateway:
      server:
        webflux:
          # StripPrefix=1 applies to the ledger route only. The gateway namespaces every
          # downstream under /api, but ledger-service itself serves /ledger/** with no /api
          # prefix, so that leading segment must be removed before forwarding. AuthCore, by
          # contrast, serves /api/accounts and /api/machine verbatim, so those two routes
          # forward the path unchanged.
          routes:
            - id: authcore-accounts
              uri: ${gatekeeper.downstream.authcore}
              predicates:
                - Path=/api/accounts/**
            - id: authcore-machine
              uri: ${gatekeeper.downstream.authcore}
              predicates:
                - Path=/api/machine/**
            - id: ledger
              uri: ${gatekeeper.downstream.ledger}
              predicates:
                - Path=/api/ledger/**
              filters:
                - StripPrefix=1
                # ledger-service is JWT-only, and a key caller is refused before reaching it
                # (RouteScopeAuthorizationManager). What remains is a JWT caller sending a
                # blank X-API-Key, which would otherwise be forwarded to a service that can do
                # nothing with it. The AuthCore routes keep the header: AuthCore
                # re-authenticates the key itself.
                - RemoveRequestHeader=X-API-Key
  data:
    redis:
      host: localhost
      port: 6379

gatekeeper:
  downstream:
    authcore: http://localhost:8080
    ledger: http://localhost:8082
  auth:
    issuer: http://localhost:8080
    jwk-set-uri: http://localhost:8080/oauth2/jwks
  api-key:
    # AuthCore's introspection endpoint, and the credential the gateway presents to it.
    # The key is scoped to apikeys:introspect only — see the M3 design, section 5.
    introspection-uri: ${gatekeeper.downstream.authcore}/api/internal/api-keys/introspect
    gateway-key: ak_gatekeeper_introspection_local_only_00000
    # The positive TTL IS the API-key revocation latency. A disabled key keeps working
    # for at most this long.
    cache-ttl: 60s
    # Shorter: caching a rejection absorbs a retry storm from a misconfigured client,
    # while a short window limits how much an enumeration attempt is amplified.
    negative-cache-ttl: 10s
    # The JWKS fetch has no timeout and that is filed as an M7 defect. Do not repeat it:
    # a host that accepts the connection and never answers must fail, not hang.
    timeout: 2s
  rate-limit:
    # How long a request waits for Redis before going through unlimited. Rate limiting is a
    # capacity control, not a security control, so a Redis failure must not become a gateway
    # outage — and it must fail fast, not hang (the JWKS fetch's missing timeout is an open M7
    # item; this call does not repeat it). See the M5 design, section 7.
    redis-timeout: 200ms
    default-plan: free
    plans:
      free:
        requests-per-second: 5
        burst: 10
        daily-quota: 1000
      pro:
        requests-per-second: 50
        burst: 100
        daily-quota: 100000
    # Anyone unlisted is on default-plan. Tenants are user tokens' tenant claim; clients are a
    # tenant-less token's aud (its client id); api-keys are the key's name from introspection.
    assignments:
      tenants:
        acme: pro
      clients:
        authcore-machine: pro
      api-keys:
        demo-reporting-job: free
  revocation:
    # How long the revocation check waits for Redis. A revoked token getting through is a security
    # failure, so an unanswered check refuses (503 with Retry-After) rather than admitting — the
    # opposite of rate-limit.redis-timeout above — and it must refuse fast, not hang. See the M6
    # design, sections 4 and 7.
    redis-timeout: 200ms
  resilience:
    # Fetching AuthCore's key set: connect and response timeout. Past it, bearer tokens that need a
    # key fetch are refused 503 KEYS_UNAVAILABLE rather than left hanging. The M7 design, section 4.
    jwks-timeout: 2s
    # Each route's response timeout, by route id, in PLAIN MILLISECONDS: the routes' metadata refers
    # to these, and Spring Cloud Gateway silently ignores a non-numeric route timeout. A timeout is
    # answered 504 DOWNSTREAM_TIMEOUT. The M7 design, section 5.
    response-timeout-millis:
      authcore-accounts: 5000
      authcore-machine: 5000
      ledger: 5000
    # One breaker per downstream (authcore, ledger). It counts connect errors, timeouts and
    # downstream 502/503/504 — never a 500, which is the downstream's own answer. The M7 design,
    # sections 6 and 7.
    breaker:
      sliding-window-size: 20
      minimum-calls: 10
      failure-rate-threshold: 50
      open-for: 10s
      trial-calls: 3
    # One semaphore bulkhead per downstream: beyond this many requests in flight, refused at once
    # 503 DOWNSTREAM_BUSY. A refusal never counts as a breaker failure. The M7 design, section 10.
    bulkhead:
      max-concurrent-calls: 50

management:
  endpoints:
    web:
      exposure:
        # "gateway" is deliberately absent. Listing it here does nothing: Spring Cloud
        # Gateway annotates its endpoint @RestControllerEndpoint(defaultAccess = NONE),
        # and the access check short-circuits before exposure is ever consulted, so the
        # endpoint would still never register. Turning it on needs
        # management.endpoint.gateway.access: read-only — and then a rule of its own in
        # RouteScopeAuthorizationManager, which today refuses every /actuator path but
        # health and info (NO_RULE). Who may read the route table is a decision still to
        # be made.
        include: health,info
