server:
  port: 8081

spring:
  application:
    name: gatekeeper
  cloud:
    gateway:
      server:
        webflux:
          # StripPrefix=1 applies to the ledger route only. The gateway namespaces every
          # downstream under /api, but ledger-service itself serves /ledger/** with no /api
          # prefix, so that leading segment must be removed before forwarding. AuthCore, by
          # contrast, serves /api/accounts and /api/machine verbatim, so those two routes
          # forward the path unchanged.
          routes:
            - id: authcore-accounts
              uri: ${gatekeeper.downstream.authcore}
              predicates:
                - Path=/api/accounts/**
            - id: authcore-machine
              uri: ${gatekeeper.downstream.authcore}
              predicates:
                - Path=/api/machine/**
            - id: ledger
              uri: ${gatekeeper.downstream.ledger}
              predicates:
                - Path=/api/ledger/**
              filters:
                - StripPrefix=1
                # ledger-service is JWT-only, and a key caller is refused before reaching it
                # (RouteScopeAuthorizationManager). What remains is a JWT caller sending a
                # blank X-API-Key, which would otherwise be forwarded to a service that can do
                # nothing with it. The AuthCore routes keep the header: AuthCore
                # re-authenticates the key itself.
                - RemoveRequestHeader=X-API-Key
  data:
    redis:
      host: localhost
      port: 6379

gatekeeper:
  downstream:
    authcore: http://localhost:8080
    ledger: http://localhost:8082
  auth:
    issuer: http://localhost:8080
    jwk-set-uri: http://localhost:8080/oauth2/jwks
  api-key:
    # AuthCore's introspection endpoint, and the credential the gateway presents to it.
    # The key is scoped to apikeys:introspect only — see the M3 design, section 5.
    introspection-uri: ${gatekeeper.downstream.authcore}/api/internal/api-keys/introspect
    gateway-key: ak_gatekeeper_introspection_local_only_00000
    # The positive TTL IS the API-key revocation latency. A disabled key keeps working
    # for at most this long.
    cache-ttl: 60s
    # Shorter: caching a rejection absorbs a retry storm from a misconfigured client,
    # while a short window limits how much an enumeration attempt is amplified.
    negative-cache-ttl: 10s
    # The JWKS fetch has no timeout and that is filed as an M7 defect. Do not repeat it:
    # a host that accepts the connection and never answers must fail, not hang.
    timeout: 2s

management:
  endpoints:
    web:
      exposure:
        # "gateway" is deliberately absent. Listing it here does nothing: Spring Cloud
        # Gateway annotates its endpoint @RestControllerEndpoint(defaultAccess = NONE),
        # and the access check short-circuits before exposure is ever consulted, so the
        # endpoint would still never register. Turning it on needs
        # management.endpoint.gateway.access: read-only — deferred until there is an
        # authorization model to decide who may read it, since after M2 it would fall
        # under anyExchange().authenticated() and be readable by any caller at all.
        include: health,info
