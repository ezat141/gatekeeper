server:
  port: 8081

spring:
  application:
    name: gatekeeper

gatekeeper:
  downstream:
    authcore: http://localhost:8080
    ledger: http://localhost:8082
  auth:
    issuer: http://localhost:8080
    jwk-set-uri: http://localhost:8080/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        # "gateway" is deliberately absent. Listing it here does nothing: Spring Cloud
        # Gateway annotates its endpoint @RestControllerEndpoint(defaultAccess = NONE),
        # and the access check short-circuits before exposure is ever consulted, so the
        # endpoint would still never register. Turning it on needs
        # management.endpoint.gateway.access: read-only — deferred until there is an
        # authorization model to decide who may read it, since after M2 it would fall
        # under anyExchange().authenticated() and be readable by any caller at all.
        include: health,info
